
name: Build NOTX UnZip Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit)"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Compile ASTC decoder for Android ARM64
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 --branch 5.1.0 \
            https://github.com/ARM-software/astc-encoder.git

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          NDK="$SDK/ndk/27.2.12479018"

          if [ ! -d "$NDK" ]; then
            echo "Android NDK not found: $NDK"
            exit 1
          fi

          cmake -S astc-encoder -B astc-encoder/build-android \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/astc-encoder/install" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DASTCENC_ISA_NEON=ON \
            -DASTCENC_ISA_SVE=OFF \
            -DASTCENC_DECOMPRESSOR=ON \
            -DASTCENC_CLI=ON

          cmake --build astc-encoder/build-android \
            --config Release --parallel 2

          cmake --install astc-encoder/build-android \
            --config Release

          echo "Searching for ASTC decoder:"
          find astc-encoder -type f \
            \( -name 'astcenc*' -o -name 'astcdec*' \) \
            -print

          ASTC_BIN="astc-encoder/install/bin/astcdec-neon"

          if [ ! -f "$ASTC_BIN" ]; then
            ASTC_BIN="$(find astc-encoder/build-android \
              -type f -name 'astcdec-neon' -print -quit)"
          fi

          if [ -z "$ASTC_BIN" ] || [ ! -f "$ASTC_BIN" ]; then
            echo "ERROR: ASTC decoder binary not found."
            exit 1
          fi

          mkdir -p app/src/main/assets/astcenc/arm64-v8a

          cp "$ASTC_BIN" \
            app/src/main/assets/astcenc/arm64-v8a/astcenc

          chmod 755 \
            app/src/main/assets/astcenc/arm64-v8a/astcenc

          file app/src/main/assets/astcenc/arm64-v8a/astcenc

      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "Project files verified."

      - name: Check ASTC decoder packaging
        shell: bash
        run: |
          set -euo pipefail

          test -s app/src/main/assets/astcenc/arm64-v8a/astcenc
          ls -lh app/src/main/assets/astcenc/arm64-v8a/astcenc

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK and decoder
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "APK generated:"
          ls -lh "$APK"

          if command -v unzip >/dev/null 2>&1; then
            unzip -l "$APK" | grep 'assets/astcenc/arm64-v8a/astcenc'
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOTX-UnZip-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
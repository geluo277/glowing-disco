
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "Android SDK not found: $SDK"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK/cmdline-tools"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Accept SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Check project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew not found at repository root."
            find . -maxdepth 3 -name gradlew -print
            exit 1
          fi

          chmod +x gradlew

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error